<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heartbridge</title>
<style>
:root{--bg:#fbf4f4;--fg:#1d1416;--card:#fff;--muted:#6a5a5e;--line:#ecd9dc;--red:#c8203a}
@media (prefers-color-scheme:dark){:root{--bg:#17110f;--fg:#f6eeee;--card:#241a1d;--muted:#bfaeb2;--line:#3a2a2f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#5b1840,#c8203a);color:#fff}
header b{font-size:1.2rem}header select{padding:4px;border-radius:6px}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:1rem}
button{background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:.95rem;margin:3px 4px 3px 0}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--line)}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}nav button{background:var(--card);color:var(--fg);border:1px solid var(--line)}nav button.on{background:var(--red);color:#fff}
img.ph{width:100%;max-height:300px;object-fit:cover;border-radius:10px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;margin:4px 0;background:var(--line)}.m.me{margin-left:auto;background:var(--red);color:#fff}
.s{color:var(--muted);font-size:.85rem}.e{color:var(--red);font-weight:700}
</style>
</head>
<body>
<header><b>Heartbridge</b><select id="lg" onchange="setL(this.value)"><option value="fr">FR</option><option value="en">EN</option><option value="it">IT</option></select></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var SB_URL="https://xrhuiggynluetskzmule.supabase.co",SB_KEY="sb_publishable_8RryZXt70_NmMgM1Fqlv5Q_tIpUHQgg";
var FEE="10 $",PAY_INFO=""; // moyens de paiement du modérateur : à renseigner
var sb=supabase.createClient(SB_URL,SB_KEY),L="fr",ok18=false,me=null,prof=null,poll=null,P={},cur="browse";
try{L=localStorage.getItem("lg")||"fr"}catch(e){}
var T={
fr:{age:"Réservé aux adultes de 18 ans et plus",i18:"J’ai 18 ans ou plus",enter:"Entrer",login:"Se connecter",signup:"Créer un compte",email:"E-mail",pass:"Mot de passe (8 caractères min.)",pseudo:"Pseudo",birth:"Date de naissance",gender:"Je suis",seek:"Je cherche",gm:"Homme",gf:"Femme",ga:"Tous",country:"Pays",city:"Ville",bio:"À propos de toi",photo:"Ta vraie photo",save:"Envoyer mon profil",wait:"Ton profil est en attente de validation par le modérateur. Reviens plus tard.",blocked:"Ce compte n’est pas actif.",pay:"Dernière étape : paie les frais d’inscription de "+FEE+", puis envoie la preuve au modérateur. Ton compte sera activé après vérification.",browse:"Profils",msgs:"Messages",me:"Mon profil",admin:"Modération",send:"Envoyer",report:"Signaler",block:"Bloquer",write:"Écrire",logout:"Déconnexion",del:"Supprimer mon profil",approve:"Approuver",reject:"Refuser",suspend:"Suspendre",paid:"Payé",unpaid:"Non payé",none:"Aucun résultat.",ageErr:"Tu dois avoir 18 ans ou plus.",mail:"Vérifie ton e-mail pour confirmer ton compte, puis connecte-toi.",all:"Tous les pays",rules:"Règles : adultes de 18 ans et plus, vrais profils, aucune annonce de services sexuels payants, aucune demande d’argent.",reason:"Raison du signalement ?",sure:"Confirmer ?",err:"Erreur : ",yrs:"ans",ph:"Ton message…",done:"Fait."},
en:{age:"Adults only (18+)",i18:"I am 18 or older",enter:"Enter",login:"Log in",signup:"Create account",email:"E-mail",pass:"Password (8 characters min.)",pseudo:"Nickname",birth:"Date of birth",gender:"I am",seek:"I am looking for",gm:"Man",gf:"Woman",ga:"Everyone",country:"Country",city:"City",bio:"About you",photo:"Your real photo",save:"Submit my profile",wait:"Your profile is waiting for the moderator’s approval. Come back later.",blocked:"This account is not active.",pay:"Last step: pay the registration fee of "+FEE+", then send the proof to the moderator. Your account will be activated after checking.",browse:"Profiles",msgs:"Messages",me:"My profile",admin:"Moderation",send:"Send",report:"Report",block:"Block",write:"Message",logout:"Log out",del:"Delete my profile",approve:"Approve",reject:"Reject",suspend:"Suspend",paid:"Paid",unpaid:"Unpaid",none:"No results.",ageErr:"You must be 18 or older.",mail:"Check your e-mail to confirm your account, then log in.",all:"All countries",rules:"Rules: adults 18+, real profiles, no ads for paid sexual services, no requests for money.",reason:"Reason for the report?",sure:"Confirm?",err:"Error: ",yrs:"yrs",ph:"Your message…",done:"Done."},
it:{age:"Riservato ai maggiorenni (18+)",i18:"Ho 18 anni o più",enter:"Entra",login:"Accedi",signup:"Crea account",email:"E-mail",pass:"Password (min. 8 caratteri)",pseudo:"Soprannome",birth:"Data di nascita",gender:"Sono",seek:"Cerco",gm:"Uomo",gf:"Donna",ga:"Tutti",country:"Paese",city:"Città",bio:"Su di te",photo:"La tua vera foto",save:"Invia il mio profilo",wait:"Il tuo profilo è in attesa di approvazione dal moderatore. Torna più tardi.",blocked:"Questo account non è attivo.",pay:"Ultimo passo: paga la quota di iscrizione di "+FEE+", poi invia la prova al moderatore. Il tuo account sarà attivato dopo la verifica.",browse:"Profili",msgs:"Messaggi",me:"Il mio profilo",admin:"Moderazione",send:"Invia",report:"Segnala",block:"Blocca",write:"Scrivi",logout:"Esci",del:"Elimina il mio profilo",approve:"Approva",reject:"Rifiuta",suspend:"Sospendi",paid:"Pagato",unpaid:"Non pagato",none:"Nessun risultato.",ageErr:"Devi avere 18 anni o più.",mail:"Controlla la tua e-mail per confermare l’account, poi accedi.",all:"Tutti i paesi",rules:"Regole: maggiorenni, profili reali, nessun annuncio di servizi sessuali a pagamento, nessuna richiesta di denaro.",reason:"Motivo della segnalazione?",sure:"Confermare?",err:"Errore: ",yrs:"anni",ph:"Il tuo messaggio…",done:"Fatto."}};
function t(k){return (T[L]&&T[L][k])||T.en[k]||k}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
var app=$("app");
function setL(v){L=v;try{localStorage.setItem("lg",v)}catch(e){}route()}
$("lg").value=L;
function age(d){var b=new Date(d),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}
var SKIP="ZZ,EU,UN,EZ,QO,XA,XB,AC,CP,DG,EA,IC,TA";
function countries(){var dn=new Intl.DisplayNames([L],{type:"region",fallback:"none"}),a=[],A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";for(var i=0;i<26;i++)for(var j=0;j<26;j++){var c=A[i]+A[j],n;if(SKIP.indexOf(c)>=0)continue;try{n=dn.of(c)}catch(e){continue}if(n)a.push([c,n])}a.sort(function(x,y){return x[1].localeCompare(y[1],L)});return a}
function copts(sel,first){return '<option value="">'+first+'</option>'+countries().map(function(x){return '<option value="'+x[0]+'"'+(x[0]===sel?" selected":"")+">"+esc(x[1])+"</option>"}).join("")}
function cname(c){try{return new Intl.DisplayNames([L],{type:"region"}).of(c)}catch(e){return c||""}}
function msg(s){app.innerHTML='<div class="card">'+s+'</div><button class="g" onclick="sb.auth.signOut()">'+t("logout")+"</button>"}
function flash(s,bad){alert((bad?t("err"):"")+s)}

sb.auth.onAuthStateChange(function(ev,s){me=s?s.user:null;setTimeout(route,0)});

async function route(){
  clearInterval(poll);$("lg").value=L;
  if(!ok18)return gate();
  if(!me)return authView("login");
  var r=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=r.data;
  if(!prof)return profForm();
  if(prof.status==="rejected"||prof.status==="suspended")return msg(esc(t("blocked")));
  if(prof.status==="pending")return msg(esc(t("wait")));
  if(!prof.paid&&!prof.is_admin)return msg(esc(t("pay"))+(PAY_INFO?"<p><b>"+esc(PAY_INFO)+"</b></p>":""));
  main(cur)
}
function gate(){app.innerHTML='<div class="card" style="text-align:center"><h2>'+t("age")+'</h2><p><label><input type="checkbox" id="c18" style="width:auto" onchange="$(\'g18\').disabled=!this.checked"> '+t("i18")+'</label></p><button id="g18" disabled onclick="ok18=true;route()">'+t("enter")+'</button><p class="s">'+t("rules")+"</p></div>"}
function authView(m){app.innerHTML='<div class="card"><h2>'+(m==="login"?t("login"):t("signup"))+'</h2><input id="em" type="email" placeholder="'+t("email")+'"><input id="pw" type="password" placeholder="'+t("pass")+'"><button onclick="doAuth(\''+m+'\')">'+(m==="login"?t("login"):t("signup"))+'</button><button class="g" onclick="authView(\''+(m==="login"?"signup":"login")+'\')">'+(m==="login"?t("signup"):t("login"))+'</button><p class="s">'+t("rules")+"</p></div>"}
async function doAuth(m){var e=$("em").value.trim(),p=$("pw").value;if(!e||p.length<8)return flash(t("pass"),1);
  var r=m==="login"?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
  if(r.error)return flash(r.error.message,1);if(m==="signup"&&!r.data.session)msg(esc(t("mail")))}
function profForm(){var mx=new Date();mx.setFullYear(mx.getFullYear()-18);
  app.innerHTML='<div class="card"><h2>'+t("me")+'</h2><input id="ps" maxlength="30" placeholder="'+t("pseudo")+'"><label class="s">'+t("birth")+'</label><input id="bd" type="date" max="'+mx.toISOString().slice(0,10)+'"><label class="s">'+t("gender")+'</label><select id="gd"><option value="M">'+t("gm")+'</option><option value="F">'+t("gf")+'</option></select><label class="s">'+t("seek")+'</label><select id="sk"><option value="M">'+t("gm")+'</option><option value="F">'+t("gf")+'</option><option value="A">'+t("ga")+'</option></select><label class="s">'+t("country")+'</label><select id="co">'+copts("","—")+'</select><input id="ci" placeholder="'+t("city")+'"><textarea id="bi" rows="3" maxlength="500" placeholder="'+t("bio")+'"></textarea><label class="s">'+t("photo")+'</label><input id="fp" type="file" accept="image/*"><button onclick="saveProf()">'+t("save")+'</button><p class="s">'+t("rules")+"</p></div>"}
async function saveProf(){var v=function(i){return $(i).value.trim()};
  if(v("ps").length<2||!v("bd")||!v("co")||!$("fp").files[0])return flash("—",1);
  if(age(v("bd"))<18)return flash(t("ageErr"),1);
  var f=$("fp").files[0];if(f.size>4e6)return flash("Max 4 MB",1);
  var path=me.id+"/"+Date.now()+".jpg",u=await sb.storage.from("photos").upload(path,f,{contentType:f.type});
  if(u.error)return flash(u.error.message,1);
  var url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
  var r=await sb.from("profiles").insert({id:me.id,pseudo:v("ps"),birth_date:v("bd"),gender:v("gd"),looking_for:v("sk"),country:v("co"),city:v("ci"),bio:v("bi"),photo_url:url});
  if(r.error)return flash(r.error.message,1);route()}

function main(tab){cur=tab;clearInterval(poll);
  var tabs=[["browse",t("browse")],["msgs",t("msgs")],["me",t("me")]];if(prof.is_admin)tabs.push(["adm",t("admin")]);
  app.innerHTML="<nav>"+tabs.map(function(x){return '<button class="'+(x[0]===tab?"on":"")+'" onclick="main(\''+x[0]+"')\">"+x[1]+"</button>"}).join("")+'</nav><div id="v"></div>';
  ({browse:browse,msgs:convs,me:myProf,adm:admin})[tab]()}
function card(p,acts){P[p.id]=p;return '<div class="card">'+(p.photo_url?'<img class="ph" src="'+esc(p.photo_url)+'" alt="">':"")+"<h3>"+esc(p.pseudo)+", "+age(p.birth_date)+" "+t("yrs")+'</h3><div class="s">'+esc(p.city)+" · "+esc(cname(p.country))+"</div><p>"+esc(p.bio)+"</p>"+acts+"</div>"}
async function browse(){var c=$("v");c.innerHTML='<select id="fc" onchange="browse2()">'+copts("",t("all"))+'</select><div id="lst"></div>';browse2()}
async function browse2(){var q=sb.from("profiles").select("*").neq("id",me.id).eq("status","approved").order("created_at",{ascending:false}).limit(60),fc=$("fc").value;if(fc)q=q.eq("country",fc);
  var r=await q;if(r.error)return flash(r.error.message,1);var d=r.data||[];
  $("lst").innerHTML=d.length?d.map(function(p){return card(p,'<button onclick="chat(\''+p.id+'\')">'+t("write")+'</button><button class="g" onclick="rep(\''+p.id+'\')">'+t("report")+'</button><button class="g" onclick="blk(\''+p.id+'\')">'+t("block")+"</button>")}).join(""):"<p>"+t("none")+"</p>"}
async function rep(id){var r=prompt(t("reason"));if(!r)return;var x=await sb.from("reports").insert({reporter:me.id,reported:id,reason:r.slice(0,500)});flash(x.error?x.error.message:t("done"),!!x.error)}
async function blk(id){if(!confirm(t("sure")))return;var x=await sb.from("blocks").insert({blocker:me.id,blocked:id});if(x.error)return flash(x.error.message,1);main(cur)}
async function convs(){var r=await sb.from("messages").select("*").or("sender.eq."+me.id+",receiver.eq."+me.id).order("created_at",{ascending:false}).limit(300);if(r.error)return flash(r.error.message,1);
  var seen={},ids=[];(r.data||[]).forEach(function(m){var o=m.sender===me.id?m.receiver:m.sender;if(!seen[o]){seen[o]=m;ids.push(o)}});
  var n=ids.length?(await sb.from("profiles").select("*").in("id",ids)).data||[]:[];n.forEach(function(p){P[p.id]=p});
  $("v").innerHTML=ids.length?ids.map(function(o){var p=P[o];return p?'<div class="card" onclick="chat(\''+o+'\')"><b>'+esc(p.pseudo)+'</b><div class="s">'+esc(seen[o].body.slice(0,60))+"</div></div>":""}).join(""):"<p>"+t("none")+"</p>"}
async function chat(o){clearInterval(poll);if(!$("v"))main("msgs");
  var draw=async function(){var f="and(sender.eq."+me.id+",receiver.eq."+o+"),and(sender.eq."+o+",receiver.eq."+me.id+")",r=await sb.from("messages").select("*").or(f).order("created_at",{ascending:true}).limit(200),b=$("th");if(!b)return;
    b.innerHTML=(r.data||[]).map(function(m){return '<div class="m'+(m.sender===me.id?" me":"")+'">'+esc(m.body)+"</div>"}).join("");b.scrollTop=b.scrollHeight};
  var p=P[o];$("v").innerHTML='<button class="g" onclick="main(\'msgs\')">←</button> <b>'+esc(p?p.pseudo:"")+'</b><div id="th" style="max-height:55vh;overflow:auto;margin:8px 0"></div><input id="mb" maxlength="1000" placeholder="'+t("ph")+'"><button id="sd">'+t("send")+"</button>";
  $("sd").onclick=async function(){var b=$("mb").value.trim();if(!b)return;var x=await sb.from("messages").insert({sender:me.id,receiver:o,body:b});if(x.error)return flash(x.error.message,1);$("mb").value="";draw()};
  draw();poll=setInterval(draw,8000)}
function myProf(){$("v").innerHTML=card(prof,"<p class='s'>"+prof.status+(prof.paid?" · "+t("paid"):"")+'</p><button class="g" onclick="sb.auth.signOut()">'+t("logout")+'</button><button class="g" onclick="delP()">'+t("del")+"</button>")}
async function delP(){if(!confirm(t("sure")))return;var x=await sb.from("profiles").delete().eq("id",me.id);if(x.error)return flash(x.error.message,1);sb.auth.signOut()}
async function admin(){var r=await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(100),rp=await sb.from("reports").select("*").order("created_at",{ascending:false}).limit(30),h="";
  (rp.data||[]).forEach(function(x){h+='<div class="card"><b class="e">'+t("report")+"</b> → "+esc(x.reported)+"<p>"+esc(x.reason)+'</p><button class="g" onclick="setp(\''+x.reported+"',{status:'suspended'})\">"+t("suspend")+"</button></div>"});
  (r.data||[]).forEach(function(p){h+=card(p,"<p class='s'>"+p.status+" · "+(p.paid?t("paid"):t("unpaid"))+"</p><button onclick=\"setp('"+p.id+"',{status:'approved'})\">"+t("approve")+"</button><button class='g' onclick=\"setp('"+p.id+"',{status:'rejected'})\">"+t("reject")+"</button><button class='g' onclick=\"setp('"+p.id+"',{status:'suspended'})\">"+t("suspend")+"</button><button onclick=\"setp('"+p.id+"',{paid:"+!p.paid+"})\">"+(p.paid?t("unpaid"):t("paid"))+"</button>")});
  $("v").innerHTML=h||"<p>"+t("none")+"</p>"}
async function setp(id,o){var x=await sb.from("profiles").update(o).eq("id",id);if(x.error)return flash(x.error.message,1);main("adm")}
</script>
</body>
